<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background glow gradients -->
    <radialGradient id="heroGlow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#4f46e5" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heroGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#0ea5e9" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Node gradients -->
    <linearGradient id="cyanPurpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="purplePinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow Spheres -->
  <circle cx="300" cy="250" r="220" fill="url(#heroGlow1)" />
  <circle cx="360" cy="200" r="160" fill="url(#heroGlow2)" />

  <!-- Background Decorative Grid Lines -->
  <g opacity="0.15" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4">
    <line x1="80" y1="60" x2="520" y2="60" />
    <line x1="80" y1="160" x2="520" y2="160" />
    <line x1="80" y1="260" x2="520" y2="260" />
    <line x1="80" y1="360" x2="520" y2="360" />
    <line x1="80" y1="460" x2="520" y2="460" />
    <line x1="120" y1="40" x2="120" y2="480" />
    <line x1="240" y1="40" x2="240" y2="480" />
    <line x1="360" y1="40" x2="360" y2="480" />
    <line x1="480" y1="40" x2="480" y2="480" />
  </g>

  <!-- Concentric Orbital Rings -->
  <circle cx="300" cy="250" r="170" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="8 6" />
  <circle cx="300" cy="250" r="120" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.3" />
  <circle cx="300" cy="250" r="75" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.35" stroke-dasharray="5 5" />

  <!-- Neural Network Synapse Lines -->
  <g stroke="url(#cyanPurpleGrad)" stroke-width="1.8" stroke-opacity="0.45">
    <!-- Input Layer to Hidden Layer 1 -->
    <line x1="150" y1="170" x2="230" y2="130" />
    <line x1="150" y1="170" x2="230" y2="210" />
    <line x1="150" y1="250" x2="230" y2="130" />
    <line x1="150" y1="250" x2="230" y2="210" />
    <line x1="150" y1="250" x2="230" y2="290" />
    <line x1="150" y1="330" x2="230" y2="210" />
    <line x1="150" y1="330" x2="230" y2="290" />
    <line x1="150" y1="330" x2="230" y2="370" />

    <!-- Hidden Layer 1 to AI Core / Hidden Layer 2 -->
    <line x1="230" y1="130" x2="300" y2="180" />
    <line x1="230" y1="130" x2="300" y2="250" />
    <line x1="230" y1="210" x2="300" y2="180" />
    <line x1="230" y1="210" x2="300" y2="250" />
    <line x1="230" y1="210" x2="300" y2="320" />
    <line x1="230" y1="290" x2="300" y2="250" />
    <line x1="230" y1="290" x2="300" y2="320" />
    <line x1="230" y1="370" x2="300" y2="320" />

    <!-- AI Core to Hidden Layer 3 -->
    <line x1="300" y1="180" x2="370" y2="140" />
    <line x1="300" y1="180" x2="370" y2="220" />
    <line x1="300" y1="250" x2="370" y2="140" />
    <line x1="300" y1="250" x2="370" y2="220" />
    <line x1="300" y1="250" x2="370" y2="300" />
    <line x1="300" y1="320" x2="370" y2="220" />
    <line x1="300" y1="320" x2="370" y2="300" />
    <line x1="300" y1="320" x2="370" y2="360" />

    <!-- Hidden Layer 3 to Output Nodes -->
    <line x1="370" y1="140" x2="450" y2="180" />
    <line x1="370" y1="220" x2="450" y2="180" />
    <line x1="370" y1="220" x2="450" y2="260" />
    <line x1="370" y1="300" x2="450" y2="260" />
    <line x1="370" y1="300" x2="450" y2="340" />
    <line x1="370" y1="360" x2="450" y2="340" />
  </g>

  <!-- Network Nodes - Input Layer -->
  <g fill="#0284c7">
    <circle cx="150" cy="170" r="7" filter="url(#nodeGlow)" />
    <circle cx="150" cy="250" r="7" filter="url(#nodeGlow)" />
    <circle cx="150" cy="330" r="7" filter="url(#nodeGlow)" />
    <circle cx="150" cy="170" r="3" fill="#e0f2fe" />
    <circle cx="150" cy="250" r="3" fill="#e0f2fe" />
    <circle cx="150" cy="330" r="3" fill="#e0f2fe" />
  </g>

  <!-- Network Nodes - Layer 1 -->
  <g fill="#4f46e5">
    <circle cx="230" cy="130" r="8" filter="url(#nodeGlow)" />
    <circle cx="230" cy="210" r="8" filter="url(#nodeGlow)" />
    <circle cx="230" cy="290" r="8" filter="url(#nodeGlow)" />
    <circle cx="230" cy="370" r="8" filter="url(#nodeGlow)" />
    <circle cx="230" cy="130" r="3.5" fill="#ffffff" />
    <circle cx="230" cy="210" r="3.5" fill="#ffffff" />
    <circle cx="230" cy="290" r="3.5" fill="#ffffff" />
    <circle cx="230" cy="370" r="3.5" fill="#ffffff" />
  </g>

  <!-- Central AI Nucleus Hexagon -->
  <g filter="url(#softGlow)">
    <polygon points="300,205 340,228 340,272 300,295 260,272 260,228" fill="url(#purplePinkGrad)" fill-opacity="0.85" stroke="#ffffff" stroke-width="2" />
    <polygon points="300,215 330,233 330,267 300,285 270,267 270,233" fill="#0f172a" fill-opacity="0.9" stroke="#67e8f9" stroke-width="1.5" />
    <!-- AI Chip Icon in Center -->
    <rect x="288" y="238" width="24" height="24" rx="4" fill="url(#cyanPurpleGrad)" />
    <path d="M295 244h10v12h-10z" fill="#ffffff" opacity="0.9"/>
    <circle cx="300" cy="250" r="3" fill="#6366f1" />
  </g>

  <!-- Network Nodes - Layer 2 -->
  <g fill="#6366f1">
    <circle cx="300" cy="180" r="7.5" filter="url(#nodeGlow)" />
    <circle cx="300" cy="320" r="7.5" filter="url(#nodeGlow)" />
    <circle cx="300" cy="180" r="3" fill="#e0e7ff" />
    <circle cx="300" cy="320" r="3" fill="#e0e7ff" />
  </g>

  <!-- Network Nodes - Layer 3 -->
  <g fill="#9333ea">
    <circle cx="370" cy="140" r="8" filter="url(#nodeGlow)" />
    <circle cx="370" cy="220" r="8" filter="url(#nodeGlow)" />
    <circle cx="370" cy="300" r="8" filter="url(#nodeGlow)" />
    <circle cx="370" cy="360" r="8" filter="url(#nodeGlow)" />
    <circle cx="370" cy="140" r="3.5" fill="#f5d0fe" />
    <circle cx="370" cy="220" r="3.5" fill="#f5d0fe" />
    <circle cx="370" cy="300" r="3.5" fill="#f5d0fe" />
    <circle cx="370" cy="360" r="3.5" fill="#f5d0fe" />
  </g>

  <!-- Network Nodes - Output Layer -->
  <g fill="#06b6d4">
    <circle cx="450" cy="180" r="8" filter="url(#nodeGlow)" />
    <circle cx="450" cy="260" r="8" filter="url(#nodeGlow)" />
    <circle cx="450" cy="340" r="8" filter="url(#nodeGlow)" />
    <circle cx="450" cy="180" r="3.5" fill="#cffafe" />
    <circle cx="450" cy="260" r="3.5" fill="#cffafe" />
    <circle cx="450" cy="340" r="3.5" fill="#cffafe" />
  </g>

  <!-- Floating Glass Tag 1: Machine Learning & Python -->
  <g filter="url(#softGlow)">
    <rect x="75" y="90" width="160" height="42" rx="10" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="1.2" stroke-opacity="0.6"/>
    <circle cx="95" cy="111" r="6" fill="#6366f1" />
    <text x="110" y="115" fill="#f8fafc" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.3">Machine Learning</text>
  </g>

  <!-- Floating Glass Tag 2: Generative AI & LLMs -->
  <g filter="url(#softGlow)">
    <rect x="360" y="70" width="165" height="42" rx="10" fill="url(#cardGrad)" stroke="#06b6d4" stroke-width="1.2" stroke-opacity="0.6"/>
    <circle cx="380" cy="91" r="6" fill="#06b6d4" />
    <text x="395" y="95" fill="#f8fafc" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.3">Generative AI &amp; LLMs</text>
  </g>

  <!-- Floating Glass Tag 3: Data Analysis -->
  <g filter="url(#softGlow)">
    <rect x="220" y="420" width="160" height="42" rx="10" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.6"/>
    <circle cx="240" cy="441" r="6" fill="#10b981" />
    <text x="255" y="445" fill="#f8fafc" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.3">Data Analysis &amp; Python</text>
  </g>

  <!-- Dynamic Particle Sparkles -->
  <circle cx="280" cy="110" r="2" fill="#67e8f9" opacity="0.8" />
  <circle cx="430" cy="130" r="2.5" fill="#c084fc" opacity="0.9" />
  <circle cx="190" cy="380" r="2" fill="#38bdf8" opacity="0.7" />
  <circle cx="420" cy="400" r="2" fill="#818cf8" opacity="0.8" />
  <circle cx="120" cy="200" r="1.5" fill="#34d399" opacity="0.6" />
</svg>
